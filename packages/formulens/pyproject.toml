[project]
name = "formulens"
version = "0.1.0"
description = "Local equation-to-LaTeX recognition with a Linux-first CLI."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Rajesh", email = "hyperoot.tech@proton.me" }]
dependencies = [
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "utilityhub-config>=0.2.7",
]

[project.scripts]
formulens = "formulens:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
