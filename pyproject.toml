[project]
name = "formulens-workspace"
version = "0.1.0"
description = "Development workspace for Formulens, a local equation-to-LaTeX tool."
requires-python = ">=3.14"
dependencies = [
  "formulens",
]

[tool.uv.workspace]
members = [
  "packages/formulens",
]

[tool.uv.sources]
formulens = { workspace = true }
